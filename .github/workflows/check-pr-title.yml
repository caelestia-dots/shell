name: Check PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr-title:
    concurrency:
      group: check-pr-title-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: caelestia-dots/.github/.github/workflows/check-pr-title.yml@main
    with:
      scope_file: .github/scopes.txt
