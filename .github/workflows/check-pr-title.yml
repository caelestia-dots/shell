name: Check PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  check-pr-title:
    runs-on: ubuntu-slim

    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            background
            bar
            dashboard
            drawers
            launcher
            lock
            nexus
            notifs
            osd
            picker
            toasts
            session
            sidebar
            utilities
            winfo

            blobs
            components
            config
            core
            images
            models
            plugins
            services
            settings
            utils

            assets
            i18n
            nix
            scripts
          subjectPattern: ^(?![A-Z]).+$ # No starting with uppercase
          subjectPatternError: The subject must not start with an uppercase character.

  label-breaking:
    runs-on: ubuntu-slim

    permissions:
      pull-requests: write

    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^[a-zA-Z]+(\([^\)]*\))?!: ]]; then
            gh pr edit "$PR" --add-label breaking
          else
            gh pr edit "$PR" --remove-label breaking
          fi
