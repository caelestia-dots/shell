name: Check PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  check-pr-title:
    runs-on: ubuntu-slim

    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            background
            bar
            dashboard
            drawers
            launcher
            lock
            nexus
            notifs
            osd
            picker
            toasts
            session
            sidebar
            utilities
            winfo

            blobs
            components
            config
            core
            images
            models
            plugins
            services
            settings
            utils

            assets
            i18n
            nix
            scripts
          subjectPattern: ^(?![A-Z]).+$ # No starting with uppercase
          subjectPatternError: The subject must not start with an uppercase character.
