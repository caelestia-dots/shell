name: Check PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            bar
            dashboard
            launcher
            sidebar
            utilities
            notifs
            osd
            lock
            session
            winfo
            popouts
            toasts

            background
            nexus
            picker

            services
            config
            utils
            components
            plugins

            assets
            i18n
            nix
            scripts
          subjectPattern: ^(?![A-Z]).+$ # No starting with uppercase
          subjectPatternError: The subject must not start with an uppercase character.
