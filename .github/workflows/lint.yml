name: Lint code

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lint: >-
        ${{ github.event_name == 'push'
            || steps.filter.outputs.source == 'true'
            || steps.filter.outputs.workflow == 'true' }}
    steps:
      - name: Filter modified paths
        uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            source:
              - "**"
              - "!**/*.md"
              - "!.github/**"
              - "!scripts/qml-lint-conventions.py"
              - "!.vscode/**"
              - "!assets/**"
              - "!.gitignore"
              - "!**/*.nix"
              - "!**/flake.lock"
            workflow:
              - ".github/workflows/lint.yml"

  lint-qml:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          # Set version and git rev for CI build so we don't call git
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clazy -DVERSION= -DGIT_REVISION=
          cmake --build build

      - name: Lint QML
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmllint --version

          # Generate tooling
          touch .qmlls.ini
          QT_QPA_PLATFORM=offscreen QML2_IMPORT_PATH="$PWD/build/qml:$QML2_IMPORT_PATH" timeout 2 qs -p .

          # Construct linter args
          set -l build_dir (grep -oP "(?<=buildDir=\")(.*)(?=\")" .qmlls.ini)
          set -l import_paths (grep -oP "(?<=importPaths=\")(.*)(?=\")" .qmlls.ini | string split :)
          set -l args -I $build_dir
          for path in $import_paths
            set -a args -I $path
          end
          set -l qml_files (string match -vr 'build/.*' **.qml)

          # Lint
          set -l lint_out (/usr/lib/qt6/bin/qmllint --import disable $args $qml_files 2>&1 | tee /dev/stderr)
          test -z "$lint_out" || exit 1

  lint-cpp:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DVERSION= -DGIT_REVISION=

      - name: Lint C++
        run: |
          clang-tidy --version
          run-clang-tidy -p build -quiet -j "$(nproc)" -warnings-as-errors='*' \
            -source-filter='^(?!.*/build/).*\.cpp$'

  lint-check:
    if: always()
    needs:
      - changes
      - lint-qml
      - lint-cpp
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify lint results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_REQUIRED: ${{ needs.changes.outputs.lint }}
          QML_RESULT: ${{ needs.lint-qml.result }}
          CPP_RESULT: ${{ needs.lint-cpp.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection did not succeed."
            exit 1
          fi

          case "$LINT_REQUIRED" in
            true)
              if [[ "$QML_RESULT" != "success" || "$CPP_RESULT" != "success" ]]; then
                echo "::error::Required linting did not all succeed."
                exit 1
              fi
              ;;
            false)
              if [[ "$QML_RESULT" != "skipped" || "$CPP_RESULT" != "skipped" ]]; then
                echo "::error::Unexpected lint results."
                exit 1
              fi
              echo "No files changed that required linting."
              ;;
            *)
              echo "::error::Missing or invalid lint decision."
              exit 1
              ;;
          esac
