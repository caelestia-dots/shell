name: Lint code

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!.github/**"
      - ".github/workflows/build.yml"
      - "!.vscode/**"
      - "!assets/**"
      - "!.gitignore"
      - "!**/*.nix"
      - "!**/flake.lock"

jobs:
  lint-qml:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          # Set version and git rev for CI build so we don't call git
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clazy -DVERSION= -DGIT_REVISION=
          cmake --build build

      - name: Lint QML
        shell: bash
        run: |
          /usr/lib/qt6/bin/qmllint --version

          # Use known import paths directly (skip qs -p . which fails at runtime)
          # build/qml has Caelestia modules, /usr/lib/qt6/qml has Quickshell (including qs.services in CI image)
          args="-I $PWD/build/qml -I /usr/lib/qt6/qml -I $PWD"
          qml_files=$(find . -name "*.qml" ! -path "./build/*")

          # Lint
          /usr/lib/qt6/bin/qmllint --import disable $args $qml_files

  lint-cpp:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DVERSION= -DGIT_REVISION=

      - name: Lint C++
        run: |
          clang-tidy --version
          run-clang-tidy -p build -quiet -j "$(nproc)" -warnings-as-errors='*' \
            -source-filter='^(?!.*/build/).*\.cpp$'