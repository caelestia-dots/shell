name: Lint code

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      pull-requests: read
    with:
      filter-group: build

  lint-qml:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CCACHE_COMPILERCHECK: "%compiler% --version"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lint-qml-clazy
          install: no
          save: ${{ github.event_name == 'push' }}

      - name: CMake build
        run: |
          # Set version and git rev for CI build so we don't call git
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clazy \
            "-DCMAKE_CXX_FLAGS=-Xclang -fno-pch-timestamp" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DVERSION= -DGIT_REVISION=
          cmake --build build

      - name: Lint QML
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmllint --version

          # Generate tooling
          touch .qmlls.ini
          QT_QPA_PLATFORM=offscreen QML2_IMPORT_PATH="$PWD/build/qml:$QML2_IMPORT_PATH" timeout 2 qs -p .

          # Construct linter args
          set -l build_dir (grep -oP "(?<=buildDir=\")(.*)(?=\")" .qmlls.ini)
          set -l import_paths (grep -oP "(?<=importPaths=\")(.*)(?=\")" .qmlls.ini | string split :)
          set -l args -I $build_dir
          for path in $import_paths
            set -a args -I $path
          end
          set -l qml_files (string match -vr 'build/.*' **.qml)

          # Lint
          set -l lint_out (mktemp)
          /usr/lib/qt6/bin/qmllint $args $qml_files 2> $lint_out

          set -l singleton_pattern 'Type [A-Z][a-zA-Z0-9]* not declared as singleton in qmldir but using pragma Singleton'
          set -l post_reload_hook_pattern 'PostReloadHook was not found\. Did you add all imports and dependencies\?'
          sed -i -E "/(($singleton_pattern)|($post_reload_hook_pattern)) \[import\]/d" $lint_out

          cat $lint_out

          ! test -s $lint_out

  lint-cpp:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Compute clang-tidy cache context
        id: ctcache-context
        shell: bash
        run: |
          tool_hash="$({ pacman -Q clang llvm-libs; sha256sum /usr/bin/clang-tidy-cache; } | sha256sum | cut -d ' ' -f 1)"
          echo "tools=$tool_hash" >> "$GITHUB_OUTPUT"

      - name: Restore clang-tidy cache
        id: ctcache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ctcache
          key: ctcache-lint-cpp-clang-${{ steps.ctcache-context.outputs.tools }}-${{ hashFiles('**/.clang-tidy') }}-${{ github.sha }}
          restore-keys: |
            ctcache-lint-cpp-clang-${{ steps.ctcache-context.outputs.tools }}-${{ hashFiles('**/.clang-tidy') }}-

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DVERSION= -DGIT_REVISION=

      - name: Lint C++
        env:
          CTCACHE_SAVE_OUTPUT: "1"
          CTCACHE_LOCAL: "1"
          CTCACHE_DIR: ${{ github.workspace }}/.ctcache
          CTCACHE_STRIP: ${{ github.workspace }}
        run: |
          clang-tidy --version

          run-clang-tidy -p build -quiet -j "$(nproc)" -warnings-as-errors='*' \
            -clang-tidy-binary=/usr/local/bin/clang-tidy-cached \
            -source-filter='^(?!.*/build/).*\.cpp$'

      - name: Save clang-tidy cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ctcache
          key: ${{ steps.ctcache-restore.outputs.cache-primary-key }}

  lint-check:
    if: always()
    needs:
      - changes
      - lint-qml
      - lint-cpp
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify lint results
        uses: $/.github/actions/verify-checks
        with:
          needs: ${{ toJSON(needs) }}
          checks: |
            {
              "lint-qml": "lint",
              "lint-cpp": "lint"
            }
