name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      build: >-
        ${{ github.event_name == 'push'
            || steps.filter.outputs.source == 'true'
            || steps.filter.outputs.workflow == 'true' }}
    steps:
      - name: Filter modified paths
        uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            source:
              - "**"
              - "!**/*.md"
              - "!.github/**"
              - "!scripts/qml-lint-conventions.py"
              - "!.vscode/**"
              - "!assets/**"
              - "!.gitignore"
            workflow:
              - ".github/workflows/build.yml"

  build-nix:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 1G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-
          # created more than this number of seconds ago
          purge-created: 0
          # or, last accessed more than this number of seconds ago
          # relative to the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: 0
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never

      - name: Build flake
        run: nix build

  build-cpp:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: build-arch-${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            compiler: g++
          - name: clazy
            compiler: clazy

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          # Set version and git rev for CI build so we don't call git
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_FLAGS=-Werror \
            -DVERSION= -DGIT_REVISION=
          cmake --build build

  build-check:
    if: always()
    needs:
      - changes
      - build-nix
      - build-cpp
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify build results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          NIX_RESULT: ${{ needs.build-nix.result }}
          CPP_RESULT: ${{ needs.build-cpp.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection did not succeed."
            exit 1
          fi

          case "$BUILD_REQUIRED" in
            true)
              if [[ "$NIX_RESULT" != "success" || "$CPP_RESULT" != "success" ]]; then
                echo "::error::Required builds did not all succeed."
                exit 1
              fi
              ;;
            false)
              if [[ "$NIX_RESULT" != "skipped" || "$CPP_RESULT" != "skipped" ]]; then
                echo "::error::Unexpected build results."
                exit 1
              fi
              echo "No build-relevant files changed."
              ;;
            *)
              echo "::error::Missing or invalid build decision."
              exit 1
              ;;
          esac
