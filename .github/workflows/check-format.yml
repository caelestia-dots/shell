name: Check formatting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      pull-requests: read
    with:
      filter-group: format

  check-qml:
    needs: changes
    if: needs.changes.outputs.format-qml == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check QML format
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmlformat --version
          for file in (string match -v 'build/*' **.qml)
            /usr/lib/qt6/bin/qmlformat $file | diff -u $file - || exit 1
          end
          python3 scripts/qml-lint-conventions.py

  check-cpp:
    needs: changes
    if: needs.changes.outputs.format-cpp == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check C++ format
        shell: fish {0}
        run: |
          clang-format --version
          find plugin extras -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror

  format-check:
    if: always()
    needs:
      - changes
      - check-qml
      - check-cpp
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify formatting results
        uses: $/.github/actions/verify-checks
        with:
          needs: ${{ toJSON(needs) }}
          checks: |
            {
              "check-qml": "format-qml",
              "check-cpp": "format-cpp"
            }
